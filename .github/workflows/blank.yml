name: Runtime Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "acceptance/**"
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/blank.yml"

permissions:
  contents: read

jobs:
  um-di-runtime-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate acceptance source
        run: bash acceptance/source-review-check.sh

      - name: Run UM/DI runtime acceptance
        run: bash acceptance/run-local.sh

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-acceptance-evidence-${{ github.run_number }}
          path: acceptance/evidence/
          if-no-files-found: warn
          retention-days: 14
