services:
  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 20

  backend:
    environment:
      APP_ENV: acceptance
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      MAILPIT_API_URL: http://mailpit:8025
      MAX_UPLOAD_BYTES: "1048576"
      IDLE_SESSION_MINUTES: "1"
      VERIFICATION_TOKEN_MINUTES: "5"
      PASSWORD_RESET_TOKEN_MINUTES: "1"
      ACCEPTANCE_RUN_ID: ${ACCEPTANCE_RUN_ID}
      METRICS_TOKEN: acceptance-metrics-probe-only
      ACCEPTANCE_EVIDENCE_DIR_IN_CONTAINER: /evidence
      TIMING_SAMPLES: ${TIMING_SAMPLES:-100}
      TIMING_WARMUPS: ${TIMING_WARMUPS:-6}
      TIMING_ORDER_SEED: ${TIMING_ORDER_SEED:-acceptance-balanced-v1}
      TIMING_MEDIAN_REL_TOL: ${TIMING_MEDIAN_REL_TOL:-0.25}
      TIMING_P95_REL_TOL: ${TIMING_P95_REL_TOL:-0.35}
      TIMING_KS_MAX: ${TIMING_KS_MAX:-0.35}
      SLO_MIN_API_REQUESTS: ${SLO_MIN_API_REQUESTS:-100}
      SLO_MAX_5XX_RATIO: ${SLO_MAX_5XX_RATIO:-0.01}
      SLO_P95_LATENCY_SECONDS: ${SLO_P95_LATENCY_SECONDS:-2.5}
      LOAD_REQUESTS: ${LOAD_REQUESTS:-240}
      LOAD_CONCURRENCY: ${LOAD_CONCURRENCY:-8}
      LOAD_P95_MAX_SECONDS: ${LOAD_P95_MAX_SECONDS:-1.0}
      LOAD_MIN_REQUESTS_PER_SECOND: ${LOAD_MIN_REQUESTS_PER_SECOND:-10}
      LOAD_MAX_ERROR_RATIO: ${LOAD_MAX_ERROR_RATIO:-0.01}
      LOAD_MAX_5XX_RATIO: ${LOAD_MAX_5XX_RATIO:-0.01}
      # The timing probe intentionally performs 212 failed logins. Rate-limit
      # behavior has separate contracts; this override preserves that probe.
      LOGIN_RATE_LIMIT: "1000"
      # Deliberately low so the share-throttling regression test can trigger
      # a genuine 429 and window recovery in seconds rather than minutes.
      # This is a test-environment override only -- see core/config.py for
      # the real V1 defaults (30 requests / 60 seconds).
      SHARE_VIEW_RATE_LIMIT: "3"
      SHARE_VIEW_RATE_WINDOW_SECONDS: "2"
    depends_on:
      mailpit:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./acceptance:/acceptance:ro
      - ${ACCEPTANCE_EVIDENCE_DIR:-./acceptance/evidence}:/evidence

  worker:
    shm_size: "2gb"
    environment:
      APP_ENV: acceptance
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      MAILPIT_API_URL: http://mailpit:8025
      MAX_UPLOAD_BYTES: "1048576"
      IDLE_SESSION_MINUTES: "1"
      VERIFICATION_TOKEN_MINUTES: "5"
      PASSWORD_RESET_TOKEN_MINUTES: "1"
      OCR_PROVIDER: paddleocr
      OCR_MODEL_VERSION: PP-OCRv5_mobile_det+en_PP-OCRv5_mobile_rec
      OCR_LANGUAGE: en
      OCR_PADDLE_DEVICE: cpu
      OCR_EVAL_CER_MAX: ${OCR_EVAL_CER_MAX:-0.20}
      OCR_EVAL_WER_MAX: ${OCR_EVAL_WER_MAX:-0.35}
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      ACCEPTANCE_EVIDENCE_DIR_IN_CONTAINER: /evidence
    depends_on:
      mailpit:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./acceptance:/acceptance:ro
      - ${ACCEPTANCE_EVIDENCE_DIR:-./acceptance/evidence}:/evidence

  ui-tests:
    profiles: ["acceptance-ui"]
    build: ./acceptance/ui
    environment:
      BASE_URL: http://frontend:3000
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      frontend:
        condition: service_started
      mailpit:
        condition: service_healthy
    volumes:
      - ${ACCEPTANCE_EVIDENCE_DIR:-./acceptance/evidence}:/evidence
